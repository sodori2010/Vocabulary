<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>한자 낱말카드 학습기</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans KR (UI) & Noto Serif KR (한자 표시용 명조체) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            hanja: ['"Noto Serif KR"', '"AppleMyungjo"', '"Nanum Myeongjo"', 'Batang', 'serif'],
          },
        },
      },
    };
  </script>
  <style>
    /* 아이폰 사파리 등 모바일 뷰포트 높이 대응 및 부드러운 터치 처리 */
    body {
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .app-container {
      min-height: 100dvh;
    }
    /* 카드 전환 시 은은한 등장 효과 */
    @keyframes cardPop {
      0% {
        opacity: 0.4;
        transform: translateY(6px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-card {
      animation: cardPop 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    /* 커스텀 스크롤바 (목록 미리보기용) */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-stone-100 text-slate-900 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">

  <div class="app-container max-w-lg mx-auto flex flex-col justify-between bg-stone-50 shadow-xl sm:my-4 sm:min-h-[calc(100dvh-2rem)] sm:rounded-3xl border border-stone-200/80 overflow-hidden">

    <!-- ==================== 1. 시작 및 번호 선택 화면 ==================== -->
    <section id="start-screen" class="flex-1 flex flex-col p-5 sm:p-7 justify-between">
      <div>
        <!-- 상단 타이틀 영역 -->
        <div class="text-center pt-2 pb-5">
          <span class="inline-block px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold tracking-wide mb-2">
            총 50자 수록
          </span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
            한자 낱말카드 암기장
          </h1>
          <p class="text-sm text-slate-500 mt-1.5">
            원하는 번호를 선택해 처음이나 중간부터 학습하세요
          </p>
        </div>

        <!-- 시작 번호 선택 카드 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-stone-200/90 space-y-4">
          <div>
            <label for="start-number-select" class="block text-sm font-bold text-slate-700 mb-2">
              시작할 번호 선택 (1번 ~ 50번)
            </label>
            <div class="flex items-center gap-2">
              <select
                id="start-number-select"
                class="flex-1 bg-stone-50 border border-stone-300 text-slate-900 text-base font-semibold rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
              >
                <!-- JS로 1~50번 옵션 동적 생성 -->
              </select>
              <button
                type="button"
                id="reset-to-one-btn"
                class="px-3.5 py-3 rounded-xl bg-stone-100 hover:bg-stone-200 active:scale-95 text-slate-700 text-sm font-semibold transition whitespace-nowrap"
                title="1번으로 초기화"
              >
                1번부터
              </button>
            </div>
          </div>

          <!-- 학습 순서 옵션 (순차 / 무작위) -->
          <div class="flex items-center justify-between pt-2 border-t border-stone-100">
            <div>
              <span class="text-sm font-bold text-slate-700 block">무작위 섞기 모드</span>
              <span class="text-xs text-slate-400">선택한 번호부터 끝까지 순서를 섞습니다</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="shuffle-toggle" class="sr-only peer" />
              <div class="w-12 h-7 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-stone-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-indigo-600"></div>
            </label>
          </div>
        </div>

        <!-- 전체 한자 목록 빠른 선택 그리드 (중간 번호 찾기용) -->
        <div class="mt-5">
          <div class="flex items-center justify-between mb-2 px-1">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">전체 한자 번호표 (클릭 시 시작 번호 지정)</span>
            <span id="selected-preview-badge" class="text-xs font-bold text-indigo-600">현재 선택: 1번 (㚆)</span>
          </div>
          <div
            id="hanja-grid-list"
            class="grid grid-cols-5 gap-2 max-h-56 sm:max-h-64 overflow-y-auto p-2 bg-white rounded-2xl border border-stone-200/90 shadow-inner"
          >
            <!-- JS로 50개 한자 버튼 동적 생성 -->
          </div>
        </div>
      </div>

      <!-- 하단 학습 시작 버튼 -->
      <div class="pt-5">
        <button
          id="start-study-btn"
          type="button"
          class="w-full py-4 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-lg shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2"
        >
          <span id="start-btn-label">1번부터 학습 시작</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </section>


    <!-- ==================== 2. 낱말카드 학습 화면 ==================== -->
    <section id="study-screen" class="hidden flex-1 flex flex-col justify-between p-4 sm:p-6">
      <!-- 상단 바: 진행도, 중간 번호 이동, 종료 버튼 -->
      <header class="flex items-center justify-between gap-2 pb-3">
        <!-- 현재 번호 및 빠른 이동 드롭다운 -->
        <div class="flex items-center gap-2">
          <div class="relative">
            <select
              id="ingame-jump-select"
              aria-label="번호 바로 이동"
              class="appearance-none bg-white border border-stone-300 text-slate-800 font-bold text-sm rounded-xl pl-3 pr-8 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
            >
              <!-- JS로 동적 업데이트 -->
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-2.5 flex items-center text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>
          <span id="progress-counter" class="text-xs sm:text-sm font-semibold text-slate-500">
            1 / 50
          </span>
        </div>

        <!-- 종료 버튼 -->
        <button
          id="quit-study-btn"
          type="button"
          class="px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 active:scale-95 text-rose-600 border border-rose-200/80 text-sm font-bold transition flex items-center gap-1.5"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
          <span>종료</span>
        </button>
      </header>

      <!-- 진행률 바 -->
      <div class="w-full h-1.5 bg-stone-200 rounded-full overflow-hidden mb-4">
        <div id="progress-bar-fill" class="h-full bg-indigo-600 transition-all duration-300 rounded-full" style="width: 2%;"></div>
      </div>

      <!-- 중앙 한자 플래시카드 영역 -->
      <main id="flashcard-box" class="flex-1 flex flex-col justify-center my-1">
        <div class="bg-white rounded-3xl border border-stone-200/90 shadow-md p-6 sm:p-8 flex flex-col items-center justify-between min-h-[340px] sm:min-h-[390px] relative">
          
          <!-- 카드 좌상단 원본 번호 뱃지 -->
          <div class="w-full flex items-center justify-between">
            <span id="card-original-number" class="px-3 py-1 rounded-lg bg-stone-100 text-stone-600 text-xs font-bold">
              No. 1
            </span>
            <span id="shuffle-badge" class="hidden px-2.5 py-1 rounded-lg bg-amber-50 text-amber-700 text-xs font-semibold border border-amber-200/60">
              무작위 순서
            </span>
          </div>

          <!-- 큰 한자 글자 표시 영역 -->
          <div class="my-auto py-4 flex items-center justify-center w-full">
            <div
              id="hanja-character"
              class="font-hanja text-[7.5rem] sm:text-[9rem] leading-none font-bold text-slate-900 select-none tracking-tight"
            >
              㚆
            </div>
          </div>

          <!-- 하단 뜻 / 음 가림판 (직접 터치해도 열림) -->
          <div class="w-full grid grid-cols-2 gap-3 pt-2">
            <!-- 뜻 (훈) 박스 -->
            <button
              type="button"
              id="meaning-card-slot"
              class="group relative flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-stone-200 bg-stone-50/80 hover:border-amber-300 py-4 px-2 min-h-[84px] transition-all focus:outline-none"
            >
              <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">뜻 (훈)</span>
              <span id="meaning-hidden-placeholder" class="text-sm font-semibold text-stone-400 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
                가려짐
              </span>
              <span id="meaning-text" class="hidden text-xl sm:text-2xl font-extrabold text-amber-700 break-keep text-center">
                돌아올
              </span>
            </button>

            <!-- 음 (소리) 박스 -->
            <button
              type="button"
              id="reading-card-slot"
              class="group relative flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-stone-200 bg-stone-50/80 hover:border-emerald-300 py-4 px-2 min-h-[84px] transition-all focus:outline-none"
            >
              <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">음 (소리)</span>
              <span id="reading-hidden-placeholder" class="text-sm font-semibold text-stone-400 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
                가려짐
              </span>
              <span id="reading-text" class="hidden text-xl sm:text-2xl font-extrabold text-emerald-700 break-keep text-center">
                복
              </span>
            </button>
          </div>

        </div>
      </main>

      <!-- 하단 조작 버튼 영역 (엄지손가락으로 누르기 쉬운 큰 버튼 배치) -->
      <footer class="pt-4 space-y-3">
        <!-- 1행: 뜻 버튼 / 음 버튼 -->
        <div class="grid grid-cols-2 gap-3">
          <button
            id="toggle-meaning-btn"
            type="button"
            class="py-4 px-4 rounded-2xl bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white font-bold text-lg shadow-md shadow-amber-500/20 transition flex items-center justify-center gap-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
              <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
            </svg>
            <span id="meaning-btn-label">뜻 보기</span>
          </button>

          <button
            id="toggle-reading-btn"
            type="button"
            class="py-4 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold text-lg shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd" />
            </svg>
            <span id="reading-btn-label">음 보기</span>
          </button>
        </div>

        <!-- 2행: 이전 버튼 (보조) + 다음 버튼 (메인) -->
        <div class="flex gap-3">
          <button
            id="prev-card-btn"
            type="button"
            class="px-4 py-4 rounded-2xl bg-stone-200 hover:bg-stone-300 disabled:opacity-40 disabled:pointer-events-none active:scale-[0.98] text-slate-700 font-bold text-base transition"
            aria-label="이전 한자"
          >
            이전
          </button>

          <button
            id="next-card-btn"
            type="button"
            class="flex-1 py-4 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold text-lg shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2"
          >
            <span id="next-btn-label">다음 한자</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </footer>
    </section>


    <!-- ==================== 3. 학습 종료 / 완료 요약 화면 ==================== -->
    <section id="summary-screen" class="hidden flex-1 flex flex-col justify-between p-6 sm:p-8 text-center">
      <div class="my-auto space-y-6">
        <div class="w-20 h-20 mx-auto rounded-3xl bg-indigo-100 text-indigo-600 flex items-center justify-center shadow-inner">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>

        <div>
          <h2 id="summary-title" class="text-2xl sm:text-3xl font-extrabold text-slate-900">
            학습을 종료했습니다
          </h2>
          <p id="summary-subtitle" class="text-slate-500 mt-2 text-sm sm:text-base">
            오늘도 한자 암기 수고하셨습니다!
          </p>
        </div>

        <!-- 학습 통계 요약 카드 -->
        <div class="bg-white rounded-2xl p-5 border border-stone-200 shadow-sm space-y-3 text-left">
          <div class="flex justify-between items-center py-1 border-b border-stone-100">
            <span class="text-sm text-slate-500 font-medium">학습 시작 위치</span>
            <span id="summary-start-info" class="text-sm font-bold text-slate-800">1번 (㚆)</span>
          </div>
          <div class="flex justify-between items-center py-1 border-b border-stone-100">
            <span class="text-sm text-slate-500 font-medium">마지막 확인 한자</span>
            <span id="summary-last-info" class="text-sm font-bold text-slate-800">10번 (乙)</span>
          </div>
          <div class="flex justify-between items-center py-1">
            <span class="text-sm text-slate-500 font-medium">확인한 카드 수</span>
            <span id="summary-count-info" class="text-base font-extrabold text-indigo-600">총 10개</span>
          </div>
        </div>
      </div>

      <!-- 하단 재시작 / 번호 선택 이동 버튼 -->
      <div class="space-y-3 pt-6">
        <button
          id="continue-from-last-btn"
          type="button"
          class="w-full py-4 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-base shadow-lg shadow-indigo-600/20 transition"
        >
          이어서 학습하기
        </button>
        <div class="grid grid-cols-2 gap-3">
          <button
            id="restart-first-btn"
            type="button"
            class="py-3.5 px-4 rounded-2xl bg-stone-200 hover:bg-stone-300 active:scale-[0.98] text-slate-800 font-bold text-sm transition"
          >
            1번부터 다시
          </button>
          <button
            id="back-to-home-btn"
            type="button"
            class="py-3.5 px-4 rounded-2xl bg-white hover:bg-stone-100 active:scale-[0.98] text-slate-800 border border-stone-300 font-bold text-sm transition"
          >
            번호 선택 화면
          </button>
        </div>
      </div>
    </section>

  </div>

  <script>
    // 1. 사용자 제공 한자 n개 원본 데이터셋
    const HANJA_DATA = [
      { id: 1, hanja: '㚆', meaning: '돌아올', reading: '복' },
      { id: 2, hanja: '一', meaning: '한', reading: '일' },
      { id: 3, hanja: '三', meaning: '석', reading: '삼' },
      { id: 4, hanja: '上', meaning: '윗', reading: '상' },
      { id: 5, hanja: '下', meaning: '아래', reading: '하' },
      { id: 6, hanja: '不', meaning: '아닐', reading: '불' },
      { id: 7, hanja: '丘', meaning: '언덕', reading: '구' },
      { id: 8, hanja: '中', meaning: '가운데', reading: '중' },
      { id: 9, hanja: '之', meaning: '갈', reading: '지' },
      { id: 10, hanja: '乙', meaning: '새', reading: '을' },

    // 2. 앱 상태 관리
    const state = {
      selectedStartNumber: 1, // 시작 화면에서 고른 번호 (1 ~ 50)
      deck: [],               // 현재 세션에서 학습할 카드 배열
      currentIndex: 0,        // deck 내 현재 인덱스
      isMeaningVisible: false,// 뜻 표시 여부
      isReadingVisible: false,// 음 표시 여부
      isShuffled: false,      // 무작위 모드 여부
      visitedIds: new Set(),  // 이번 세션에서 본 한자 ID 집합
    };

    // 3. DOM 요소 참조
    const screens = {
      start: document.getElementById('start-screen'),
      study: document.getElementById('study-screen'),
      summary: document.getElementById('summary-screen'),
    };

    const startNumberSelect = document.getElementById('start-number-select');
    const resetToOneBtn = document.getElementById('reset-to-one-btn');
    const shuffleToggle = document.getElementById('shuffle-toggle');
    const hanjaGridList = document.getElementById('hanja-grid-list');
    const selectedPreviewBadge = document.getElementById('selected-preview-badge');
    const startStudyBtn = document.getElementById('start-study-btn');
    const startBtnLabel = document.getElementById('start-btn-label');

    const ingameJumpSelect = document.getElementById('ingame-jump-select');
    const progressCounter = document.getElementById('progress-counter');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const quitStudyBtn = document.getElementById('quit-study-btn');

    const flashcardBox = document.getElementById('flashcard-box');
    const cardOriginalNumber = document.getElementById('card-original-number');
    const shuffleBadge = document.getElementById('shuffle-badge');
    const hanjaCharacter = document.getElementById('hanja-character');

    const meaningCardSlot = document.getElementById('meaning-card-slot');
    const meaningHiddenPlaceholder = document.getElementById('meaning-hidden-placeholder');
    const meaningText = document.getElementById('meaning-text');

    const readingCardSlot = document.getElementById('reading-card-slot');
    const readingHiddenPlaceholder = document.getElementById('reading-hidden-placeholder');
    const readingText = document.getElementById('reading-text');

    const toggleMeaningBtn = document.getElementById('toggle-meaning-btn');
    const meaningBtnLabel = document.getElementById('meaning-btn-label');
    const toggleReadingBtn = document.getElementById('toggle-reading-btn');
    const readingBtnLabel = document.getElementById('reading-btn-label');

    const prevCardBtn = document.getElementById('prev-card-btn');
    const nextCardBtn = document.getElementById('next-card-btn');
    const nextBtnLabel = document.getElementById('next-btn-label');

    const summaryTitle = document.getElementById('summary-title');
    const summarySubtitle = document.getElementById('summary-subtitle');
    const summaryStartInfo = document.getElementById('summary-start-info');
    const summaryLastInfo = document.getElementById('summary-last-info');
    const summaryCountInfo = document.getElementById('summary-count-info');
    const continueFromLastBtn = document.getElementById('continue-from-last-btn');
    const restartFirstBtn = document.getElementById('restart-first-btn');
    const backToHomeBtn = document.getElementById('back-to-home-btn');

    // 4. 화면 전환 유틸리티
    function showScreen(screenName) {
      Object.values(screens).forEach((el) => el.classList.add('hidden'));
      screens[screenName].classList.remove('hidden');
    }

    // 5. 시작 화면 초기화 (드롭다운 및 50자 그리드 생성)
    function initStartScreen() {
      startNumberSelect.innerHTML = '';
      hanjaGridList.innerHTML = '';

      HANJA_DATA.forEach((item) => {
        // 드롭다운 옵션 추가
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = `${item.id}번 — ${item.hanja}`;
        startNumberSelect.appendChild(option);

        // 한자 빠른 선택 버튼 추가
        const gridBtn = document.createElement('button');
        gridBtn.type = 'button';
        gridBtn.dataset.id = item.id;
        gridBtn.className =
          'hanja-grid-item flex flex-col items-center justify-center py-2 px-1 rounded-xl border border-stone-200 bg-stone-50 hover:bg-indigo-50 hover:border-indigo-300 transition text-center';
        gridBtn.innerHTML = `
          <span class="text-[10px] font-bold text-slate-400 leading-none mb-1">${item.id}</span>
          <span class="font-hanja text-xl font-bold text-slate-800 leading-none">${item.hanja}</span>
        `;
        gridBtn.addEventListener('click', () => {
          setSelectedStartNumber(item.id);
        });
        hanjaGridList.appendChild(gridBtn);
      });

      setSelectedStartNumber(1);
    }

    // 시작 번호 선택 동기화
    function setSelectedStartNumber(num) {
      const parsed = Math.min(50, Math.max(1, Number(num) || 1));
      state.selectedStartNumber = parsed;
      startNumberSelect.value = String(parsed);

      const targetItem = HANJA_DATA[parsed - 1];
      selectedPreviewBadge.textContent = `현재 선택: ${parsed}번 (${targetItem.hanja})`;
      startBtnLabel.textContent = `${parsed}번부터 학습 시작`;

      // 그리드 하이라이트 갱신
      document.querySelectorAll('.hanja-grid-item').forEach((btn) => {
        const btnId = Number(btn.dataset.id);
        if (btnId === parsed) {
          btn.classList.remove('bg-stone-50', 'border-stone-200');
          btn.classList.add('bg-indigo-600', 'border-indigo-600', 'shadow-sm');
          btn.querySelector('span:first-child').classList.replace('text-slate-400', 'text-indigo-200');
          btn.querySelector('span:last-child').classList.replace('text-slate-800', 'text-white');
        } else {
          btn.classList.add('bg-stone-50', 'border-stone-200');
          btn.classList.remove('bg-indigo-600', 'border-indigo-600', 'shadow-sm');
          btn.querySelector('span:first-child').classList.replace('text-indigo-200', 'text-slate-400');
          btn.querySelector('span:last-child').classList.replace('text-white', 'text-slate-800');
        }
      });
    }

    // 배열 셔플 함수 (Fisher-Yates)
    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // 6. 학습 세션 시작
    function startStudySession(startNum = state.selectedStartNumber) {
      const startIndex = Math.min(49, Math.max(0, startNum - 1));
      let slicedDeck = HANJA_DATA.slice(startIndex);

      state.isShuffled = shuffleToggle.checked;
      if (state.isShuffled) {
        slicedDeck = shuffleArray(slicedDeck);
      }

      state.deck = slicedDeck;
      state.currentIndex = 0;
      state.visitedIds = new Set();

      // 상단 빠른 이동 드롭다운 채우기
      ingameJumpSelect.innerHTML = '';
      state.deck.forEach((item, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${item.id}번 (${item.hanja})`;
        ingameJumpSelect.appendChild(opt);
      });

      shuffleBadge.classList.toggle('hidden', !state.isShuffled);
      showScreen('study');
      renderCurrentCard();
    }

    // 7. 현재 카드 렌더링 (뜻과 음은 무조건 초기 숨김 상태로 리셋)
    function renderCurrentCard() {
      const currentCard = state.deck[state.currentIndex];
      if (!currentCard) return;

      state.visitedIds.add(currentCard.id);

      // 뜻/음 초기화 (숨김)
      state.isMeaningVisible = false;
      state.isReadingVisible = false;

      // 카드 애니메이션 재실행
      flashcardBox.classList.remove('animate-card');
      void flashcardBox.offsetWidth; // reflow
      flashcardBox.classList.add('animate-card');

      // 텍스트 채우기
      cardOriginalNumber.textContent = `No. ${currentCard.id}`;
      hanjaCharacter.textContent = currentCard.hanja;
      meaningText.textContent = currentCard.meaning;
      readingText.textContent = currentCard.reading;

      // 상단 진행 상태 업데이트
      ingameJumpSelect.value = String(state.currentIndex);
      const totalInDeck = state.deck.length;
      const currentStep = state.currentIndex + 1;
      progressCounter.textContent = `${currentStep} / ${totalInDeck}`;
      progressBarFill.style.width = `${(currentStep / totalInDeck) * 100}%`;

      // 이전/다음 버튼 상태 업데이트
      prevCardBtn.disabled = state.currentIndex === 0;
      if (state.currentIndex === totalInDeck - 1) {
        nextBtnLabel.textContent = '학습 완료';
      } else {
        nextBtnLabel.textContent = '다음 한자';
      }

      updateRevealUI();
    }

    // 8. 뜻 / 음 가림막 및 버튼 상태 동기화
    function updateRevealUI() {
      // 뜻 (Meaning) UI
      if (state.isMeaningVisible) {
        meaningHiddenPlaceholder.classList.add('hidden');
        meaningText.classList.remove('hidden');
        meaningCardSlot.classList.remove('border-dashed', 'border-stone-200', 'bg-stone-50/80');
        meaningCardSlot.classList.add('border-solid', 'border-amber-300', 'bg-amber-50/60');
        meaningBtnLabel.textContent = '뜻 숨기기';
      } else {
        meaningHiddenPlaceholder.classList.remove('hidden');
        meaningText.classList.add('hidden');
        meaningCardSlot.classList.add('border-dashed', 'border-stone-200', 'bg-stone-50/80');
        meaningCardSlot.classList.remove('border-solid', 'border-amber-300', 'bg-amber-50/60');
        meaningBtnLabel.textContent = '뜻 보기';
      }

      // 음 (Reading) UI
      if (state.isReadingVisible) {
        readingHiddenPlaceholder.classList.add('hidden');
        readingText.classList.remove('hidden');
        readingCardSlot.classList.remove('border-dashed', 'border-stone-200', 'bg-stone-50/80');
        readingCardSlot.classList.add('border-solid', 'border-emerald-300', 'bg-emerald-50/60');
        readingBtnLabel.textContent = '음 숨기기';
      } else {
        readingHiddenPlaceholder.classList.remove('hidden');
        readingText.classList.add('hidden');
        readingCardSlot.classList.add('border-dashed', 'border-stone-200', 'bg-stone-50/80');
        readingCardSlot.classList.remove('border-solid', 'border-emerald-300', 'bg-emerald-50/60');
        readingBtnLabel.textContent = '음 보기';
      }
    }

    // 9. 학습 종료 / 완료 화면 표시
    function finishStudySession(isCompletedAll = false) {
      const firstCard = state.deck[0];
      const lastCard = state.deck[state.currentIndex];

      if (isCompletedAll) {
        summaryTitle.textContent = '모든 카드를 학습했습니다!';
        summarySubtitle.textContent = '선택한 범위의 한자를 끝까지 마쳤습니다.';
      } else {
        summaryTitle.textContent = '학습을 종료했습니다';
        summarySubtitle.textContent = '중간에 종료해도 언제든 이어서 학습할 수 있습니다.';
      }

      summaryStartInfo.textContent = `${firstCard.id}번 (${firstCard.hanja})`;
      summaryLastInfo.textContent = `${lastCard.id}번 (${lastCard.hanja})`;
      summaryCountInfo.textContent = `총 ${state.visitedIds.size}개 한자`;

      // 이어하기 버튼 처리 (마지막 50번까지 다 본 경우 숨김 처리)
      if (isCompletedAll || lastCard.id >= 50) {
        continueFromLastBtn.classList.add('hidden');
      } else {
        continueFromLastBtn.classList.remove('hidden');
        const nextId = lastCard.id + 1;
        const nextItem = HANJA_DATA[nextId - 1];
        continueFromLastBtn.textContent = `다음 번호(${nextId}번 ${nextItem.hanja})부터 이어하기`;
        continueFromLastBtn.dataset.nextId = nextId;
      }

      showScreen('summary');
    }

    // 10. 이벤트 리스너 등록
    startNumberSelect.addEventListener('change', (e) => {
      setSelectedStartNumber(e.target.value);
    });

    resetToOneBtn.addEventListener('click', () => {
      setSelectedStartNumber(1);
    });

    startStudyBtn.addEventListener('click', () => {
      startStudySession(state.selectedStartNumber);
    });

    // 뜻 버튼 & 뜻 카드 영역 클릭
    function toggleMeaning() {
      state.isMeaningVisible = !state.isMeaningVisible;
      updateRevealUI();
    }
    toggleMeaningBtn.addEventListener('click', toggleMeaning);
    meaningCardSlot.addEventListener('click', toggleMeaning);

    // 음 버튼 & 음 카드 영역 클릭
    function toggleReading() {
      state.isReadingVisible = !state.isReadingVisible;
      updateRevealUI();
    }
    toggleReadingBtn.addEventListener('click', toggleReading);
    readingCardSlot.addEventListener('click', toggleReading);

    // 다음 한자 버튼
    function goToNextCard() {
      if (state.currentIndex < state.deck.length - 1) {
        state.currentIndex += 1;
        renderCurrentCard();
      } else {
        finishStudySession(true);
      }
    }
    nextCardBtn.addEventListener('click', goToNextCard);

    // 이전 한자 버튼
    function goToPrevCard() {
      if (state.currentIndex > 0) {
        state.currentIndex -= 1;
        renderCurrentCard();
      }
    }
    prevCardBtn.addEventListener('click', goToPrevCard);

    // 학습 중 상단 드롭다운으로 특정 번호 이동
    ingameJumpSelect.addEventListener('change', (e) => {
      state.currentIndex = Number(e.target.value);
      renderCurrentCard();
    });

    // 중간 종료 버튼
    quitStudyBtn.addEventListener('click', () => {
      finishStudySession(false);
    });

    // 요약 화면 버튼들
    continueFromLastBtn.addEventListener('click', () => {
      const nextId = Number(continueFromLastBtn.dataset.nextId) || 1;
      setSelectedStartNumber(nextId);
      startStudySession(nextId);
    });

    restartFirstBtn.addEventListener('click', () => {
      setSelectedStartNumber(1);
      startStudySession(1);
    });

    backToHomeBtn.addEventListener('click', () => {
      showScreen('start');
    });

    // 데스크톱 키보드 단축키 지원 (1: 뜻, 2: 음, 오른쪽 화살표/엔터: 다음, 왼쪽 화살표: 이전)
    document.addEventListener('keydown', (e) => {
      if (screens.study.classList.contains('hidden')) return;
      // select 요소에 포커스가 있을 때는 기본 동작 우선
      if (document.activeElement === ingameJumpSelect) return;

      if (e.key === '1') {
        toggleMeaning();
      } else if (e.key === '2') {
        toggleReading();
      } else if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        goToNextCard();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goToPrevCard();
      }
    });

    // 앱 초기화 실행
    initStartScreen();
  </script>
</body>
</html>
